<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Bloggy Creator Panel</title>
		<meta name="description" content="Write and publish posts on your Bloggy blog." />
		<meta name="theme-color" content="#4f46e5" />
		<!-- The panel is a private tool; keep it out of search results. -->
		<meta name="robots" content="noindex, nofollow" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="/panel/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/panel/main.css" />
	</head>
	<body>
		<div id="app">
			<noscript>
				<div style="max-width: 32rem; margin: 4rem auto; font-family: system-ui, sans-serif; text-align: center">
					<h1>JavaScript required</h1>
					<p>The Bloggy panel needs JavaScript to run. Your published blog does not need it, because it is rendered on the server.</p>
				</div>
			</noscript>
		</div>
		<script type="module" src="/panel/main.js"></script>
	</body>
</html>
